<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FILM / TV | Ishikawa Saki</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+JP:wght@200;300;400&family=Playfair+Display:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">

<link rel="icon" href="favicon.jpg">
<link rel="stylesheet" href="style.css">

<style>

/* =========================
   FILM DARK ONLY THEME
========================= */

:root{
  --film-bg:#1F1F1F;
  --film-text:#E9ECF1;
  --film-sub:rgba(233,236,241,.65);
}

/* =========================
   BASE RESET (hero完全準拠）
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--film-bg);
  color:var(--film-text);
  font-family:var(--font-jp);
  line-height:2;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
  transition:.3s;
}

a:hover{
  opacity:.6;
}

/* =========================
   HEADER（ヒーロー完全統一）
========================= */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:40px var(--container-padding);
  background:var(--film-bg);
  border-bottom:1px solid rgba(233,236,241,.10);
}

.header-logo{
  font-family:var(--font-display);
  font-size:1rem;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--film-text);
}

.header-nav ul{
  display:flex;
  gap:28px;
  list-style:none;
}

.header-nav a{
  font-family:var(--font-body);
  font-size:.95rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:rgba(233,236,241,.7);
}

.header-nav a:hover{
  color:var(--film-text);
}

/* =========================
   LAYOUT WIDTH（ヒーロー統一）
========================= */

.container{
  width:calc(100% - (var(--container-padding) * 2));
  max-width:1920px;
  margin:0 auto;
}

/* =========================
   TITLE BLOCK
========================= */

.page-title{
  font-family:var(--font-display);
  font-weight:400;
  font-size:clamp(1.6rem,2.4vw,2rem);
  letter-spacing:.06em;
  text-transform:uppercase;
  margin-top:80px;
}

.page-subtitle{
  font-family:var(--font-body);
  font-size:1.1rem;
  line-height:1.8;
  color:var(--film-sub);
  margin-top:14px;
  max-width:760px;
}

/* =========================
   KEYNOTE IMAGES
   （白枠完全削除）
========================= */

.keynote-stack{
  margin-top:60px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:1.2vw;
}

.keynote-slide img{
  width:100%;
  height:auto;
  display:block;
  object-fit:cover;
  border:none; /* ← 白枠完全削除 */
}

/* =========================
   BACK
========================= */

.back{
  margin-top:60px;
}

.back a{
  font-family:var(--font-body);
  font-size:.95rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:rgba(233,236,241,.7);
}

.back a:hover{
  color:var(--film-text);
}

/* =========================
   FOOTER（ヒーロー統一）
========================= */

.site-footer{
  margin-top:120px;
  padding:60px var(--container-padding);
  background:var(--film-bg);
  border-top:1px solid rgba(233,236,241,.10);
  font-size:.75rem;
  color:rgba(233,236,241,.6);
  text-align:center;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .header{
    padding:24px var(--container-padding);
  }

  .keynote-stack{
    grid-template-columns:1fr;
    gap:24px;
  }

}

</style>
</head>

<body>

<header class="header">
  <div class="header-logo">ISHIKAWA SAKI</div>

  <nav class="header-nav">
    <ul>
      <li><a href="works.html">WORKS</a></li>
      <li><a href="index.html#about">ABOUT</a></li>
      <li><a href="https://tally.so/r/vGPVJX" target="_blank">CONTACT</a></li>
    </ul>
  </nav>
</header>

<main class="container">

  <h1 class="page-title">
    TV & MOVIE　仮面ライダー／戦隊
  </h1>

  <p class="page-subtitle">
    Selected costume design and visual concept works for film and television.
  </p>

  <div class="keynote-stack">

    <div class="keynote-slide">
      <img src="images/images_keynote/film_keynote1.webp" alt="">
    </div>

  </div>

  <div class="back">
    <a href="index.html">BACK TO HOME</a>
  </div>

</main>

<footer class="site-footer">
  © 2026 Saki Ishikawa. All Rights Reserved.
</footer>

</body>
</html>
