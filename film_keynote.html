<style>

/* =========================
   BASE (DARK HERO FOOTER STYLE)
========================= */

:root{
  --bg:#23272E;          /* hero footer想定ダーク */
  --surface:#2A2F38;
  --text:#F3F4F6;
  --text-sub:rgba(243,244,246,.65);
  --border:rgba(243,244,246,.12);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Noto Serif JP',serif;
}

/* =========================
   LAYOUT
========================= */

.container{
  max-width:1600px;
  margin:0 auto;
  padding:6vh 5vw 12vh;
}

/* =========================
   HEADER
========================= */

.header{
  background:var(--bg);
  border-bottom:1px solid var(--border);
}

.header-logo{
  color:var(--text);
  text-decoration:none;
}

.header-nav a{
  color:var(--text-sub);
  text-decoration:none;
  transition:.2s;
}

.header-nav a:hover{
  color:var(--text);
}

/* =========================
   TITLE
========================= */

.page-title{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.8rem,3vw,2.35rem);
  font-weight:400;
  letter-spacing:.06em;
  margin-bottom:1rem;
}

.page-subtitle{
  font-size:.95rem;
  opacity:.7;
  line-height:1.7;
  margin-bottom:4rem;
  color:var(--text-sub);
}

/* =========================
   KEYNOTE STACK
========================= */

.keynote-stack{
  display:flex;
  flex-direction:column;
  gap:4.5rem;
}

.keynote-slide img{
  width:100%;
  height:auto;
  display:block;
  border-radius:2px;
  border:1px solid var(--border);
}

/* =========================
   BACK LINK
========================= */

.back{
  margin-top:6rem;
  text-align:center;
  font-family:'Cormorant Garamond',serif;
  letter-spacing:.2em;
  text-transform:uppercase;
  font-size:.9rem;
}

.back a{
  color:var(--text-sub);
  text-decoration:none;
  transition:.2s;
}

.back a:hover{
  color:var(--text);
}

/* =========================
   FOOTER
========================= */

.site-footer{
  text-align:center;
  font-size:.75rem;
  opacity:.5;
  padding:6vh 0 4vh;
  border-top:1px solid var(--border);
  color:var(--text-sub);
}

/* =========================
   MOBILE
========================= */

@media (max-width:768px){

  .container{
    padding:5vh 4vw 10vh;
  }

  .keynote-stack{
    gap:2.5rem;
  }

}

</style>
</head>
