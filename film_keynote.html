<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FILM / TV | Ishikawa Saki</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+JP:wght@200;300;400&display=swap" rel="stylesheet">

<link rel="icon" href="favicon.jpg">

<style>

/* =========================
   BASE (HERO完全統一)
========================= */

:root{
  --bg:#1F1F1F;
  --text:#E9ECF1;
  --text-sub:rgba(233,236,241,.65);
  --border:rgba(233,236,241,.12);

  --font-display:'Cormorant Garamond',serif;
  --font-body:'Noto Serif JP',serif;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  line-height:2;
  font-weight:300;
  overflow-x:hidden;
}

/* =========================
   HEADER（ヒーロー完全一致）
========================= */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:28px 5vw;
  border-bottom:1px solid var(--border);
  background:var(--bg);
}

.header-logo{
  font-family:var(--font-display);
  font-size:1rem;
  letter-spacing:.08em;
  color:var(--text);
  text-decoration:none;
  text-transform:uppercase; /* ← 全部大文字 */
}

.header-nav ul{
  display:flex;
  gap:24px;
  list-style:none;
  margin:0;
  padding:0;
}

.header-nav a{
  font-size:.95rem;
  letter-spacing:.12em;
  color:var(--text-sub);
  text-decoration:none;
  transition:.25s;
  text-transform:uppercase; /* ← 全部大文字 */
}

.header-nav a:hover{
  color:var(--text);
}

/* =========================
   LAYOUT（FILM指定幅固定）
========================= */

.container{
  max-width:1500px;   /* ← film.html基準で固定 */
  margin:0 auto;
  padding:10vh 5vw 12vh;
}

/* =========================
   TITLE（ヒーロー一致）
========================= */

.page-title{
  font-family:var(--font-display);
  font-weight:400;
  font-size:clamp(2rem,3vw,2.6rem);
  letter-spacing:.06em;
  line-height:1.2;
  margin-bottom:18px;
  text-transform:uppercase;
}

.page-subtitle{
  font-size:.95rem;
  line-height:1.9;
  color:var(--text-sub);
  max-width:720px;
  margin-bottom:6vh;
}

/* =========================
   KEY VISUAL
========================= */

.keynote-stack{
  display:flex;
  flex-direction:column;
  gap:4.5rem;
}

/* ★ 重要：白い枠線完全削除 */
.keynote-slide img{
  width:100%;
  height:auto;
  display:block;
  border:none !important;   /* ← 完全消去 */
  outline:none;
  box-shadow:none;
  border-radius:2px;
  filter:contrast(1.02) brightness(.98);
}

/* =========================
   BACK LINK
========================= */

.back{
  margin-top:6rem;
  text-align:center;
  font-family:var(--font-display);
  letter-spacing:.2em;
  text-transform:uppercase;
  font-size:.9rem;
}

.back a{
  color:var(--text-sub);
  text-decoration:none;
  transition:.2s;
}

.back a:hover{
  color:var(--text);
}

/* =========================
   FOOTER（ヒーロー統一）
========================= */

.site-footer{
  text-align:center;
  font-size:.75rem;
  opacity:.55;
  padding:6vh 0 4vh;
  border-top:1px solid var(--border);
  color:var(--text-sub);
}

/* =========================
   MOBILE（ズレ防止）
========================= */

@media (max-width:768px){

  .header{
    padding:22px 4vw;
  }

  .container{
    padding:8vh 4vw 10vh;
  }

  .keynote-stack{
    gap:2.5rem;
  }

}

</style>
</head>

<body>

<header class="header">
  <a href="index.html" class="header-logo">ISHIKAWA SAKI</a>

  <nav class="header-nav">
    <ul>
      <li><a href="works.html">WORKS</a></li>
      <li><a href="index.html#about">ABOUT</a></li>
      <li><a href="https://tally.so/r/vGPVJX" target="_blank">CONTACT</a></li>
    </ul>
  </nav>
</header>

<main>

<div class="container">

<h1 class="page-title">
TV & MOVIE　仮面ライダー／スーパー戦隊
</h1>

<p class="page-subtitle">
Selected costume design and visual concept works for Japanese tokusatsu television series.
</p>

<div class="keynote-stack">

  <div class="keynote-slide">
    <img src="images/images_keynote/film_keynote1.webp" alt="">
  </div>

</div>

<div class="back">
  <a href="index.html">BACK TO HOME</a>
</div>

</div>

</main>

<footer class="site-footer">
© 2026 Saki Ishikawa. All Rights Reserved.
</footer>

</body>
</html>
